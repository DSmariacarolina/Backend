<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Postagens</title>
</head>
<body>
    <h1>Postagens</h1>
    <ul>
        {% for post in posts %}
            <li>{{ post.titulo }} - {{ post.data_publicacao }}</li>
        {% endfor %}
    </ul>
</body>
</html>
